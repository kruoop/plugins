<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Full-screen Short layer guide - replace placeholders with real assets</title><g id="background" data-z="0"><rect width="1080" height="1920" fill="#111111"/></g><g id="video-presenter-guide" data-z="20"><rect x="100" y="840" width="880" height="1060" rx="160" fill="none" stroke="#E7C558" stroke-width="6" stroke-dasharray="22 18"/><text x="540" y="1360" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="62" fill="#FFFFFF" >MOVING PRESENTER</text><text x="540" y="1440" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="62" fill="#FFFFFF" >VIDEO CUTOUT</text><text x="540" y="1560" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="37" fill="#BBBBBB" >FULL-FRAME RESULT BEHIND</text><text x="540" y="1640" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="37" fill="#BBBBBB" >NO SPLIT-SCREEN PANELS</text></g><g id="name-hook" data-z="30"><text x="540" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="125" fill="#D62532" stroke="#FFFFFF" stroke-width="18" paint-order="stroke fill">NAME</text><text x="540" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="125" fill="#D62532" stroke="#FFFFFF" stroke-width="18" paint-order="stroke fill">HOOK</text></g><g id="app-logos" data-z="40"><g id="logo-1"><rect x="400" y="90" width="280" height="280" rx="48" fill="#F6F6F6"/><text x="540" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="40" fill="#111111" >APP LOGO</text><text x="540" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="40" fill="#111111" >ONE APP</text></g></g></svg>